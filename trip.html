<style>

    background: var(--surface);
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .small-link { color: var(--ink-soft); }
  .home-link:hover, .small-link:hover { border-color: var(--accent); color: var(--accent); }
  .day-tabs {

    margin-bottom: 18px; padding: 6px 0 14px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: -22px; background: var(--bg); z-index: 10;
  }
  .day-tab {
    font-family: inherit;
    min-width: 54px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    display: inline-flex; flex-direction: column; align-items: center;
    gap: 2px;
    font-size: 13px;
    line-height: 1.1;

  .day-tab:hover { border-color: var(--accent); color: var(--accent); }
  .day-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .day-tab-date { font-size: 11px; opacity: .76; }
  .eyebrow {
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 36px;
    line-height: 1.08;
    margin: 0 0 12px;
    letter-spacing: 0;
  }
  .subtitle {
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.58;
    margin: 0 0 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 14px; }
  .chip {

    padding: 4px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-soft);

  .chip.warn { background: var(--amber-bg); color: var(--amber); border-color: #fcd34d; }
  .chip.blue { background: var(--blue-bg); color: var(--blue); border-color: #93c5fd; }
  .stop {
    display: grid;
    grid-template-columns: 50px 1fr;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;

    font-weight: 700;

    font-size: 13px;

    .day-tabs { top: -18px; }
    .map-wrap, #map { height: 58vh; min-height: 440px; }

    isHotel: true,
    note: hotel.address,
    address: hotel.address,
    bookingLink: hotel.link || null,
    mapsQuery: hotel.maps,
    nights: hotel.nights
  };
}

    { mode: "walk", line: "湖畔步道", dur: "彈性", pass: null, lug: "light" },
    { mode: "train", line: "SBB Montreux→Zürich HB", dur: "~2h40", pass: "HFC", lug: "full" },
    { mode: "walk", line: "飯店步行", dur: "~5分", pass: null, lug: "full" }],
  15: [null,
    { mode: "train", line: "Zürich HB→ZRH", dur: "~10-15分", pass: "HFC", lug: "full" },
    { mode: "walk", line: "Check-in / 出境", dur: "預留", pass: null, lug: "full" },
    { mode: "flight", line: "LX122", dur: "11h15", pass: null, lug: "full" },
    { mode: "flight", line: "BR169", dur: "2h35", pass: null, lug: "full" }]
};

// 把 leg 掛到原始 stop 物件上,buildEffectiveStops 用 {...s} 會自動帶著走
DAYS.forEach(day => {
  const legs = DAY_LEGS[day.n];
  if (!legs) return;
  day.stops.forEach((s, i) => { if (legs[i]) s.leg = legs[i]; });
});

let map;
let currentDay = 0;
let currentStops = [];
let activeMarkers = [];
let activePolylines = [];
let infoWindow;

function buildEffectiveStops(day, idx) {
  const stops = day.stops.map(s => ({ ...s }));
  const prev = idx > 0 ? DAYS[idx - 1] : null;
  const startHotel = prev && prev.hotel && prev.hotel.lat != null ? prev.hotel : null;
  const hasHotelInStops = stops.some(s => s.isHotel);
  const endHotel = !hasHotelInStops && day.hotel && day.hotel.lat != null ? day.hotel : null;
  const sameHotel = startHotel && endHotel && startHotel.name === endHotel.name;
  const startSameAsExistingHotel = startHotel && hasHotelInStops &&
    stops.some(s => s.isHotel && (s.officialName || s.name) === startHotel.name);

  function enrichWithHotel(stop, hotel) {
    stop.isHotel = true;
    if (hotel.displayName) {
      stop.officialName = hotel.name;
      stop.name = hotel.displayName;
    }
    if (!stop.address) stop.address = hotel.address || "";
    if (!stop.bookingLink) stop.bookingLink = hotel.link || null;
    if (!stop.nights) stop.nights = hotel.nights || "";
    if (!stop.mapsQuery) stop.mapsQuery = hotel.maps || null;
  }

  if (day.hotel) {
    stops.forEach(s => { if (s.isHotel) enrichWithHotel(s, day.hotel); });
  }

  function makeHotelStop(num, hotel, time, label) {
    const s = {
      num,
      name: hotel.displayName || hotel.name,
      officialName: hotel.name,
      lat: hotel.lat,
      lng: hotel.lng,
      time,
      label,
      note: hotel.address || "",
      isHotel: true
    };
    enrichWithHotel(s, hotel);
    return s;
  }

  const firstStop = stops[0];
  const startCollidesWithFirst = startHotel && firstStop && firstStop.lat != null &&
    Math.abs(firstStop.lat - startHotel.lat) < 0.001 &&
    Math.abs(firstStop.lng - startHotel.lng) < 0.001;
  function markStart(s) { s.isStartHotel = true; return s; }

  if (sameHotel) {
    if (startCollidesWithFirst) {
      enrichWithHotel(firstStop, startHotel);
      markStart(firstStop);
    } else {
      stops.unshift(markStart(makeHotelStop(0, startHotel, "連住", "🏨 出發 / 回程")));
    }
  } else {
    if (startHotel && !startSameAsExistingHotel) {
      if (startCollidesWithFirst) {
        enrichWithHotel(firstStop, startHotel);
        markStart(firstStop);
      } else {
        stops.unshift(markStart(makeHotelStop(0, startHotel, "出發", "🏨 上一晚住宿")));
      }
    } else if (startHotel && startSameAsExistingHotel) {
      const m = stops.find(s => s.isHotel && (s.officialName || s.name) === startHotel.name);
      if (m) markStart(m);
    }
    if (endHotel) {
      stops.push(makeHotelStop(stops.length + 1, endHotel, "今晚", "🏨 入住"));
    }
  }

  let routeIdx = 0;
  stops.forEach(s => { s.num = s.isStartHotel ? 0 : ++routeIdx; });
  return stops;
}

function escapeHTML(v) {
  return String(v || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function mapHref(s) {
  const q = encodeURIComponent(s.mapsQuery || s.officialName || s.name);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function legHTML(leg) {
  if (!leg) return "";
  const mode = MODE_STYLE[leg.mode] || MODE_STYLE.walk;
  const pass = leg.pass ? PASS_STYLE[leg.pass] : null;
  const lug = leg.lug ? LUG_STYLE[leg.lug] : null;
  return `
    <div class="leg-connector">
      <span class="leg-rail" style="background:${mode.color}"></span>
      <span>${mode.emoji}</span>
      <span class="leg-text">${escapeHTML(leg.line)} · ${escapeHTML(leg.dur)}</span>
      ${pass ? `<span class="leg-pass" style="background:${pass.bg};color:${pass.fg}">${pass.label}</span>` : ""}
      ${lug ? `<span class="leg-lug leg-lug-${leg.lug}">${lug.icon} ${lug.label}</span>` : ""}
    </div>
  `;
}

function stopHTML(s) {
  const num = s.num === 0 ? "00" : String(s.num).padStart(2, "0");
  const numClass = s.isHotel ? " hotel" : (s.optional ? " optional" : "");
  const hotelExtra = s.isHotel ? `
    <div class="stop-hotel-extra">
      ${s.nights ? `<div class="stop-nights">${escapeHTML(s.nights)}</div>` : ""}
      ${s.address ? `<div class="stop-address">${escapeHTML(s.address)}</div>` : ""}
      <div class="stop-actions">
        <a href="${mapHref(s)}" target="_blank" rel="noopener">Google Maps</a>
        ${s.bookingLink ? `<a href="${s.bookingLink}" target="_blank" rel="noopener">住宿連結</a>` : ""}
      </div>
    </div>
  ` : "";
  return `
    ${legHTML(s.leg)}
    <article class="stop" data-stop="${s.num}">
      <div class="stop-num${numClass}">${num}</div>
      <div>
        <div class="stop-time">${escapeHTML(s.time)} · ${escapeHTML(s.label)}</div>
        <div class="stop-name">${escapeHTML(s.name)}</div>
        <div class="stop-note">${escapeHTML(s.note)}</div>
        ${hotelExtra}
      </div>
    </article>
  `;
}

function clearMap() {
  activeMarkers.forEach(m => m.setMap(null));
  activePolylines.forEach(p => p.setMap(null));
  activeMarkers = [];
  activePolylines = [];
}

function markerIcon(s) {
  const fill = s.isHotel ? "#1F2421" : (s.optional ? "#6B6B5E" : "#B8472D");
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: s.isStartHotel ? 8 : 10,
    fillColor: fill,
    fillOpacity: 1,
    strokeColor: "#ffffff",
    strokeWeight: 2
  };
}

function popupHTML(s) {
  return `
    <div class="popup-title">${escapeHTML(s.name)}</div>
    <div class="popup-note"><strong>${escapeHTML(s.time)} · ${escapeHTML(s.label)}</strong><br>${escapeHTML(s.note)}</div>
    <div class="popup-actions"><a href="${mapHref(s)}" target="_blank" rel="noopener">Google Maps</a></div>
  `;
}

function drawDay(idx) {
  currentDay = idx;
  const day = DAYS[idx];
  currentStops = buildEffectiveStops(day, idx);
  document.getElementById("eyebrow").textContent = day.eyebrow;
  document.getElementById("title").innerHTML = day.title;
  document.getElementById("subtitle").textContent = day.subtitle;
  document.getElementById("chips").innerHTML = day.tags.map((t, i) => `<span class="chip ${i === 0 ? "good" : i === 1 ? "blue" : "warn"}">${escapeHTML(t)}</span>`).join("");
  document.getElementById("stops").innerHTML = currentStops.map(stopHTML).join("");
  document.getElementById("footer").innerHTML = day.footer || "";
  document.querySelectorAll(".day-tab").forEach((tab, tabIdx) => tab.classList.toggle("active", tabIdx === idx));
  document.querySelectorAll(".stop").forEach(el => {
    el.addEventListener("click", () => focusStop(Number(el.dataset.stop)));
  });
  if (map) renderMap(day);
}

function focusStop(num) {
  const s = currentStops.find(x => x.num === num);
  const marker = activeMarkers.find(m => m.__stopNum === num);
  if (!s || !marker) return;
  map.panTo({ lat: s.lat, lng: s.lng });
  map.setZoom(Math.max(map.getZoom(), 13));
  infoWindow.setContent(popupHTML(s));
  infoWindow.open(map, marker);
}

function renderMap(day) {
  clearMap();
  const bounds = new google.maps.LatLngBounds();
  currentStops.filter(s => s.lat != null && s.lng != null).forEach((s) => {
    const marker = new google.maps.Marker({
      position: { lat: s.lat, lng: s.lng },
      map,
      title: s.name,
      label: { text: s.num === 0 ? "00" : String(s.num).padStart(2, "0"), color: "#ffffff", fontWeight: "700", fontSize: "11px" },
      icon: markerIcon(s)
    });
    marker.__stopNum = s.num;
    marker.addListener("click", () => {
      infoWindow.setContent(popupHTML(s));
      infoWindow.open(map, marker);
    });
    activeMarkers.push(marker);
    bounds.extend(marker.getPosition());
  });

  for (let i = 1; i < currentStops.length; i++) {
    const a = currentStops[i - 1], b = currentStops[i];
    if (!a || !b || a.lat == null || b.lat == null) continue;
    const leg = b.leg || {};
    const mode = MODE_STYLE[leg.mode] || MODE_STYLE.walk;
    const line = new google.maps.Polyline({
      path: [{ lat: a.lat, lng: a.lng }, { lat: b.lat, lng: b.lng }],
      geodesic: true,
      strokeColor: mode.color,
      strokeOpacity: .72,
      strokeWeight: 3,
      icons: mode.line === "dashed" ? [{
        icon: { path: "M 0,-1 0,1", strokeOpacity: 1, scale: 3 },
        offset: "0",
        repeat: "12px"
      }] : []
    });
    line.setMap(map);
    activePolylines.push(line);
  }

  if (day.fit && !bounds.isEmpty()) map.fitBounds(bounds, 60);
  else map.setCenter(day.center || currentStops[0]);
  if (!day.fit && day.zoom) map.setZoom(day.zoom);
}

function renderTabs() {
  document.getElementById("dayTabs").innerHTML = DAYS.map((d, i) => `
    <button class="day-tab" type="button" data-day="${i}">
      <span>D${d.n}</span><span class="day-tab-date">${d.date}</span>
    </button>
  `).join("");
  document.querySelectorAll(".day-tab").forEach(tab => {
    tab.addEventListener("click", () => drawDay(Number(tab.dataset.day)));
  });
}

function renderLegend() {
  document.getElementById("mapLegend").innerHTML = Object.values(MODE_STYLE).map(m => `
    <span class="legend-chip"><span class="legend-line" style="background:${m.color}"></span>${m.emoji} ${m.label}</span>
  `).join("");
}

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 46.8, lng: 8.1 },
    zoom: 7,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true
  });
  infoWindow = new google.maps.InfoWindow();
  renderLegend();
  drawDay(0);
}

renderTabs();
drawDay(0);

const script = document.createElement("script");
script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=initMap&loading=async`;
script.async = true;
script.defer = true;
document.head.appendChild(script);
</script>
</body>
</html>
